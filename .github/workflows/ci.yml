name: CI & Container Image Publishing

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/debyez-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/debyez-backend:latest

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          build-args: |
            VITE_API_BASE_URL=http://api.debyez.localhost/api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/debyez-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/debyez-frontend:latest