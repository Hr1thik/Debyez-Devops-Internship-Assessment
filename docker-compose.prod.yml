services:
  traefik:
    image: traefik:v3.1
    container_name: debyez-traefik-prod
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - ./traefik_conf:/etc/traefik/dynamic:ro
    networks:
      - app-network

  localstack:
    image: localstack/localstack:3.0
    container_name: debyez-s3-prod
    restart: unless-stopped
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    container_name: debyez-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-debyez_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-debyez_password}
      POSTGRES_DB: ${DB_NAME:-debyez_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-debyez_user} -d ${DB_NAME:-debyez_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    image: ${DOCKERHUB_USERNAME}/debyez-backend:${IMAGE_TAG}
    container_name: debyez-backend-prod
    restart: unless-stopped
    environment:
      APP_NAME: "DevOps Assessment Dashboard"
      ENVIRONMENT: "production"
      DB_HOST: "db"
      DB_PORT: 5432
      DB_USER: ${DB_USER:-debyez_user}
      DB_PASSWORD: ${DB_PASSWORD:-debyez_password}
      DB_NAME: ${DB_NAME:-debyez_db}
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_REGION: "us-east-1"
      S3_ENDPOINT_URL: "http://localstack:4566"
      S3_PUBLIC_ENDPOINT_URL: "http://localhost:4566"
      S3_BUCKET_NAME: "debyez-bucket"
      CORS_ORIGINS: "http://app.debyez.localhost"
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  frontend:
    image: ${DOCKERHUB_USERNAME}/debyez-frontend:${IMAGE_TAG}
    container_name: debyez-frontend-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_prod_data: